name: Public statistics snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/src/package.rs", "site/Cargo.*", ".github/workflows/public-stats.yml"]

permissions:
  contents: write

concurrency:
  group: public-statistics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Read anonymous public statistics with Rust
        run: cargo run --locked --release --manifest-path site/Cargo.toml -- snapshot --output "$RUNNER_TEMP/public-summary.json"
      - name: Publish the reading on the data branch
        run: |
          git fetch --depth=1 --no-tags origin public-stats:refs/remotes/origin/public-stats
          git worktree add --detach "$RUNNER_TEMP/public-stats" refs/remotes/origin/public-stats
          cp "$RUNNER_TEMP/public-summary.json" "$RUNNER_TEMP/public-stats/summary.json"
          cd "$RUNNER_TEMP/public-stats"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add summary.json
          if git diff --cached --quiet; then
            echo 'Public statistics are unchanged.'
            exit 0
          fi
          git commit -m 'Refresh anonymous public statistics'
          git push origin HEAD:public-stats
