# Builds the Rust ESP32 firmware (firmware-rs/esp). Manual while that crate
# has not yet been validated on hardware; see firmware-rs/README.md.
name: Rust ESP32 firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # ESP-IDF 5.3's esp-clang links libxml2.so.2, which newer images lack.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: xtensa-esp32-espidf
            mcu: esp32
            board: esp32
            features: ""
            partitions: min_spiffs.csv
            flash: 4mb
          - target: xtensa-esp32-espidf
            mcu: esp32
            board: m5stickc-plus2
            features: m5stickc-plus2
            # 8 MB of flash: the C++ firmware's layout (NVS at the same place).
            partitions: default_8MB.csv
            flash: 8mb
          - target: xtensa-esp32s3-espidf
            mcu: esp32s3
            board: esp32s3
            features: ""
            partitions: min_spiffs.csv
            flash: 4mb
    steps:
      - uses: actions/checkout@v7
      - uses: esp-rs/xtensa-toolchain@ec6d36527049a7f4fb2cb0c1a644668c1bb8a2a4 # v1.7.0
        with:
          # Espressif's latest stable fork. Its 1.99.0.0 does not build std
          # for ESP-IDF (`AT_FDCWD` missing from libc); there is no 1.99.1
          # fork. The host workspace uses Rust 1.99.1.
          version: 1.97.0.0
          default: true
          buildtargets: ${{ matrix.mcu }}
          ldproxy: true
      - name: Espressif GCC on PATH
        run: |
          which xtensa-${{ matrix.mcu }}-elf-gcc
          xtensa-${{ matrix.mcu }}-elf-gcc --version | head -1
      - name: Build
        working-directory: firmware-rs/esp
        env:
          MCU: ${{ matrix.mcu }}
        run: cargo build --release --target ${{ matrix.target }} --features "${{ matrix.features }}"
      # ESP-IDF aborts at boot ("CONFLICT! driver_ng is not allowed to be
      # used with this old driver") when the legacy I2C driver is linked next
      # to the new one (M5GFX uses the new one).
      - name: One I2C driver
        working-directory: firmware-rs/esp
        run: |
          symbols=$(nm target/${{ matrix.target }}/release/bdlminer-esp)
          if grep -q ' t check_i2c_driver_conflict$' <<<"$symbols" && grep -q ' T i2c_acquire_bus_handle$' <<<"$symbols"; then
            echo "::error::both the legacy and the new I2C driver are linked: the firmware aborts at boot"
            exit 1
          fi
      # One image to flash at 0x0 (bootloader, partition table, app), e.g.
      # with https://espressif.github.io/esptool-js/ or
      # `espflash write-bin 0x0 bdlminer-esp-<board>.bin`.
      - name: Install espflash
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libudev-dev
          cargo install espflash@3.3.0 --locked
      # With ESP-IDF's own bootloader, built from sdkconfig.defaults (it skips
      # the image check at power-on, so the M5StickC Plus2 holds its power
      # sooner), instead of the one espflash ships.
      - name: Flashable image
        working-directory: firmware-rs/esp
        run: |
          bootloader=$(ls target/${{ matrix.target }}/release/build/esp-idf-sys-*/out/build/bootloader/bootloader.bin | head -n 1)
          if [ ! -f "$bootloader" ]; then
            echo "::error::ESP-IDF bootloader.bin not found"
            exit 1
          fi
          echo "bootloader: $bootloader"
          espflash save-image --chip ${{ matrix.mcu }} --merge --flash-size ${{ matrix.flash }} \
            --bootloader "$bootloader" \
            --partition-table ../../partitions/${{ matrix.partitions }} \
            target/${{ matrix.target }}/release/bdlminer-esp \
            target/${{ matrix.target }}/release/bdlminer-esp-${{ matrix.board }}.bin
      - uses: actions/upload-artifact@v7
        with:
          name: bdlminer-esp-${{ matrix.board }}
          path: |
            firmware-rs/esp/target/${{ matrix.target }}/release/bdlminer-esp
            firmware-rs/esp/target/${{ matrix.target }}/release/bdlminer-esp-${{ matrix.board }}.bin
          if-no-files-found: error
          retention-days: 7
