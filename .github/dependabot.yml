# Weekly dependency updates for the Rust firmware (both lockfiles are
# audited by CI with cargo-audit).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /firmware-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /firmware-rs/esp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
