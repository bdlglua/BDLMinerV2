# The ESP32 firmware. Not part of the host workspace: it needs the esp Rust
# toolchain (espup) and builds ESP-IDF on its first build. See ../README.md.
[package]
name = "bdlminer-esp"
description = "BDLMiner V2 firmware for ESP32 boards (ESP-IDF)"
version = "2.6.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "bdlminer-esp"
harness = false

[features]
default = []
# Boards with an M5 IMU near the battery default to a 65 C thermal limit.
m5 = []
# A screen and buttons (src/display.rs, components/bdl_ui). One board feature
# at most below.
display = []
# M5StickC Plus2: power hold on GPIO4, MPU6886 temperature.
m5stickc-plus2 = ["m5", "display"]
# Other M5Stack devices with a screen (Core/Basic/Gray/Fire, Core2, Tough on
# the ESP32; CoreS3, AtomS3... on the ESP32-S3), detected by M5GFX.
m5stack = ["display"]
# LilyGO TTGO T-Display (ESP32) and T-Display-S3, ESP32-2432S028R (CYD).
lilygo-t-display = ["display"]
lilygo-t-display-s3 = ["display"]
cyd = ["display"]
# ASIC boards, mined through the C++ firmware's drivers (components/bdl_asic):
# Bitaxe Gamma 601 (BM1370, SSD1306 128x32) and NerdNOS (BM1397 on a
# T-Display-S3).
gamma601 = ["display"]
nerdnos = ["display"]

[dependencies]
bdlminer-core = { path = "../core" }
bdlminer-app = { path = "../app" }
esp-idf-svc = { version = "0.51", features = ["std", "alloc", "binstart"] }
log = "0.4"
anyhow = "1"
serde_json = "1"
# Stratum V2 (Noise): libsecp256k1 with small precomputed tables. The
# default ones (about 1 MB) did not fit the 1.9 MB app partition; a
# handshake only takes a few milliseconds longer.
secp256k1 = { version = "0.33", default-features = false, features = ["lowmemory"] }

# The C++ firmware's hardware SHA engine and assembly kernels (src/hwsha.rs).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/bdl_hwsha"]

# The C++ firmware's screen renderer on M5GFX (src/display.rs, M5StickC Plus2).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/bdl_ui"]

# The C++ firmware's ASIC drivers (src/asic.rs; empty on chips other than
# the ESP32-S3).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/bdl_asic"]

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"

[profile.dev]
debug = true
opt-level = "z"

# The mining kernel is built for speed, the rest for size (tools/optimize.py
# does the same for the C++ firmware).
[profile.release.package.bdlminer-core]
opt-level = 3
