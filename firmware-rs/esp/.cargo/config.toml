[build]
# Original ESP32 (M5StickC Plus2, ESP32 dev boards). Others:
#   ESP32-S3: --target xtensa-esp32s3-espidf    ESP32-S2: --target xtensa-esp32s2-espidf
#   ESP32-C3: --target riscv32imc-esp-espidf
target = "xtensa-esp32-espidf"

# `-A linker_messages`: ldproxy always prints "[ldproxy] Running ldproxy"
# on stderr, which rustc reports as a warning on every build.
[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table ../../partitions/min_spiffs.csv"
rustflags = ["--cfg", "espidf_time64", "-A", "linker_messages"]

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table ../../partitions/min_spiffs.csv"
rustflags = ["--cfg", "espidf_time64", "-A", "linker_messages"]

[target.xtensa-esp32s2-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table ../../partitions/min_spiffs.csv"
rustflags = ["--cfg", "espidf_time64", "-A", "linker_messages"]

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table ../../partitions/min_spiffs.csv"
# Static code: the target's default (PIC) reaches ESP-IDF's global
# variables through a .got section, which ESP-IDF's linker script does not
# place, and the link fails ("The gap between .flash.rodata and
# .eh_frame_hdr must not exist").
rustflags = ["--cfg", "espidf_time64", "-A", "linker_messages", "-C", "relocation-model=static"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.3.2"
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults"
# C code of dependencies (secp256k1-sys): Espressif's GCC from espup, which
# builds little-endian code with long calls. Left to itself, cc picked a
# compiler that produced big-endian objects the linker refused.
CC_xtensa_esp32_espidf = "xtensa-esp32-elf-gcc"
CFLAGS_xtensa_esp32_espidf = "-mlongcalls"
CC_xtensa_esp32s3_espidf = "xtensa-esp32s3-elf-gcc"
CFLAGS_xtensa_esp32s3_espidf = "-mlongcalls"
CC_xtensa_esp32s2_espidf = "xtensa-esp32s2-elf-gcc"
CFLAGS_xtensa_esp32s2_espidf = "-mlongcalls"
CC_riscv32imc_esp_espidf = "riscv32-esp-elf-gcc"
