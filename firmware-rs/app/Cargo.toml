[package]
name = "bdlminer-app"
description = "Hardware-independent BDLMiner firmware logic: settings, miner state, pool sessions and web API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bdlminer-core = { workspace = true }
serde_json = { workspace = true }
# The setup portal's QR code (ui_view.rs), as LovyanGFX's qrcode() drew it.
qrcodegen = "1.8"
# Release signature check of GitHub updates (ECDSA P-256), pure Rust.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
secp256k1 = { workspace = true }
