<button type="button" class="chat-bubble" id="chat-bubble" aria-controls="chat" aria-expanded="false" data-al="chatOpen" aria-label="Open the chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5"></path></svg><span class="badge" id="chat-unread" hidden=""></span></button>

<section class="chat" id="chat" role="dialog" aria-labelledby="chat-title" hidden="">
<header><h2 id="chat-title" data-t="chatTitle">Chat</h2><button type="button" class="chat-online" id="chat-people" aria-pressed="false" aria-controls="chat-members" data-al="chatMembers" aria-label="Members online"><span class="dot on" aria-hidden="true"></span><b id="chat-online">–</b> <span data-t="online">online</span> <span class="caret" aria-hidden="true">▾</span></button><button type="button" class="chat-icon" id="chat-gear" aria-pressed="false" aria-controls="chat-settings" data-al="chatSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button><button type="button" class="chat-icon" id="chat-close" data-al="chatClose" aria-label="Close the chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M6 18L18 6"></path></svg></button>
</header><ol class="chat-log" id="chat-log" aria-live="polite" aria-relevant="additions"></ol>
<div class="chat-settings" id="chat-settings" hidden=""><h3 data-t="chatSettings">Settings</h3>
<div class="field"><label for="chat-name" data-t="chatName">Name</label>
<div class="row"><input id="chat-name" maxLength="24" autoComplete="nickname" data-ph="chatNamePh" placeholder="Your name"/><button type="button" class="btn-s" id="chat-save" data-t="chatSave">Save</button>
</div><p class="hint" id="chat-when" data-t="chatNameHint">Changeable every 30 days</p>
</div>
<div class="field"><label data-t="chatCodeTitle">Other device</label>
<div class="row"><button type="button" class="btn-s ghost" id="chat-qr-show" aria-expanded="false" aria-controls="chat-qr" data-t="chatQrShow">My QR code</button>
</div>
<div class="chat-qr" id="chat-qr" hidden="">
<div id="chat-qr-img" role="img" data-al="chatQrAlt" aria-label="QR code to open the chat with your name">
</div><p class="hint" data-t="chatCodeHint">Scan it with your phone. Show it to no one.</p><button type="button" class="btn-s ghost" id="chat-link" data-t="chatLink">Copy the link</button>
</div>
</div><button type="button" class="btn-s" id="chat-back" data-t="chatBack">Back to the chat</button>
</div>
<div class="chat-members" id="chat-members" hidden=""><h3 data-t="chatMembers">Members online</h3><ul id="chat-member-list"></ul><p class="hint" id="chat-guests"></p><button type="button" class="btn-s" id="chat-members-back" data-t="chatBack">Back to the chat</button>
</div><p class="chat-note" id="chat-note" role="status"></p>
<form id="chat-form" autoComplete="off">
<div class="chat-attach" id="chat-attach" hidden=""><span id="chat-attach-name"></span><button type="button" class="chat-icon" id="chat-attach-drop" data-al="chatRemove" aria-label="Remove"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M6 18L18 6"></path></svg></button>
</div>
<div class="compose"><button type="button" class="chat-icon" id="chat-file" data-al="chatAttach" aria-label="Photo or video"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7L9.2 18a2 2 0 0 1-2.8-2.8L15 6.5"></path></svg></button><input type="file" id="chat-file-input" accept="image/*,video/*" hidden=""/><button type="button" class="chat-icon rec" id="chat-rec" aria-pressed="false" data-al="chatRecord" aria-label="Voice message"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0V5M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"></path></svg></button><label class="skip" for="chat-text" data-t="chatMessage">Message</label><textarea id="chat-text" rows="1" maxLength="500" data-ph="chatTextPh" placeholder="Message…"></textarea><button type="submit" class="send" id="chat-send" data-al="chatSend" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</form><p class="chat-rules" data-t="chatRules">Public messages, photos and videos, kept 7 days. Never share a seed phrase, a private key or a password.</p>
</section>
