[package]
name = "bdlminer-site"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Rust static page generator for the BDLMiner public website"
license = "GPL-3.0-only"

[dependencies]
serde_json = "1"
sha2 = "0.10"
url = "2"
regex = "1"
semver = "1"
tempfile = "3"
percent-encoding = "2"
ureq = { version = "2.12", features = ["json"] }

# Keep the existing independent WebAssembly benchmark and its target directory.
[workspace]
exclude = ["stats-wasm", "browser"]

[profile.release]
opt-level = 2
